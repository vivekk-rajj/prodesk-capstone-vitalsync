<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">VitalSync responsive wireframe storyboard</title>
  <desc id="desc">Low-fidelity responsive wireframes for authentication, patient dashboard, doctor dashboard, appointment details, and medical timeline views.</desc>
  <style>
    .bg{fill:#f1f5f9}.frame{fill:#fff;stroke:#94a3b8;stroke-width:2}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.dark{fill:#e2e8f0}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round}.thin{stroke:#94a3b8;stroke-width:2}.txt{font:16px Arial;fill:#334155}.small{font:12px Arial;fill:#64748b}.head{font:700 20px Arial;fill:#0f172a}.title{font:700 30px Arial;fill:#0f172a}.label{font:700 14px Arial;fill:#475569}.accent{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.success{fill:#dcfce7;stroke:#86efac;stroke-width:2}.warn{fill:#fef3c7;stroke:#fbbf24;stroke-width:2}.danger{fill:#fee2e2;stroke:#fca5a5;stroke-width:2}.nav{fill:#1e293b}.white{fill:#fff}
  </style>
  <rect class="bg" width="1800" height="1500"/>
  <text class="title" x="50" y="55">VitalSync — Responsive UI/UX Wireframe Storyboard</text>
  <text class="small" x="50" y="82">Figma import reference • desktop and mobile layouts • planning artifact for the capstone blueprint</text>

  <!-- Authentication -->
  <text class="head" x="50" y="135">1. Authentication</text>
  <rect class="frame" x="50" y="155" width="760" height="390" rx="14"/>
  <rect class="accent" x="80" y="190" width="285" height="320" rx="12"/>
  <text class="head" x="110" y="245">VitalSync</text><text class="txt" x="110" y="280">Care coordination,</text><text class="txt" x="110" y="305">simplified.</text><path class="thin" d="M110 350 H330"/><text class="small" x="110" y="385">Secure role-based access</text><text class="small" x="110" y="410">for patients and providers</text>
  <rect class="panel" x="425" y="190" width="330" height="320" rx="12"/><text class="head" x="455" y="230">Welcome back</text><text class="small" x="455" y="255">Sign in to your account</text><text class="label" x="455" y="295">Email</text><rect class="frame" x="455" y="305" width="270" height="36" rx="5"/><text class="small" x="468" y="328">you@example.com</text><text class="label" x="455" y="370">Password</text><rect class="frame" x="455" y="380" width="270" height="36" rx="5"/><text class="small" x="468" y="403">••••••••</text><rect class="nav" x="455" y="445" width="270" height="38" rx="5"/><text class="white" x="555" y="470">Sign in</text><text class="small" x="455" y="502">Forgot password?  •  Create account</text>

  <!-- Mobile auth -->
  <rect class="frame" x="850" y="155" width="260" height="390" rx="18"/><text class="head" x="890" y="205">VitalSync</text><text class="small" x="890" y="230">Sign in</text><rect class="panel" x="880" y="260" width="200" height="210" rx="10"/><text class="label" x="900" y="295">Email</text><rect class="frame" x="900" y="305" width="160" height="30" rx="4"/><text class="label" x="900" y="365">Password</text><rect class="frame" x="900" y="375" width="160" height="30" rx="4"/><rect class="nav" x="900" y="425" width="160" height="30" rx="4"/><text class="white" x="950" y="446">Sign in</text><text class="small" x="900" y="490">Create account</text>

  <!-- Patient dashboard -->
  <text class="head" x="50" y="610">2. Patient dashboard</text>
  <rect class="frame" x="50" y="630" width="1060" height="390" rx="14"/><rect class="nav" x="50" y="630" width="175" height="390" rx="14 0 0 14"/><text class="white" x="78" y="680">VitalSync</text><text class="white" x="78" y="730">Dashboard</text><text class="white" x="78" y="765">Appointments</text><text class="white" x="78" y="800">Providers</text><text class="white" x="78" y="835">Prescriptions</text><text class="white" x="78" y="870">Profile</text><line class="thin" x1="250" y1="690" x2="1070" y2="690"/><text class="head" x="260" y="670">Good morning, Alex</text><text class="small" x="890" y="670">🔔  Avatar</text><rect class="accent" x="260" y="720" width="370" height="120" rx="10"/><text class="label" x="285" y="750">Next appointment</text><text class="txt" x="285" y="780">Dr. Sarah Chen • Cardiology</text><text class="small" x="285" y="808">Today, 2:30 PM • Confirmed</text><rect class="success" x="650" y="720" width="190" height="120" rx="10"/><text class="label" x="675" y="750">Prescriptions</text><text class="txt" x="675" y="785">2 active</text><text class="small" x="675" y="810">1 refill due</text><rect class="panel" x="860" y="720" width="210" height="120" rx="10"/><text class="label" x="880" y="750">Quick actions</text><text class="small" x="880" y="780">+ Book appointment</text><text class="small" x="880" y="805">View timeline</text><rect class="panel" x="260" y="875" width="810" height="110" rx="10"/><text class="label" x="285" y="905">Recent medical timeline</text><path class="line" d="M285 940 H1040"/>

  <!-- Mobile dashboard -->
  <rect class="frame" x="1160" y="630" width="260" height="390" rx="18"/><text class="head" x="1185" y="670">Dashboard</text><text class="small" x="1350" y="670">☰</text><text class="small" x="1185" y="700">Good morning, Alex</text><rect class="accent" x="1185" y="725" width="210" height="80" rx="8"/><text class="label" x="1200" y="750">Next appointment</text><text class="small" x="1200" y="775">Dr. Chen • Today 2:30 PM</text><rect class="success" x="1185" y="820" width="100" height="65" rx="8"/><text class="small" x="1200" y="845">Prescriptions</text><text class="txt" x="1200" y="870">2 active</text><rect class="panel" x="1295" y="820" width="100" height="65" rx="8"/><text class="small" x="1305" y="845">Timeline</text><text class="small" x="1305" y="870">View →</text><rect class="nav" x="1185" y="945" width="210" height="42" rx="8"/><text class="white" x="1210" y="971">Home   Appts   Profile</text>

  <!-- Doctor and appointment -->
  <text class="head" x="50" y="1090">3. Doctor dashboard and appointment details</text>
  <rect class="frame" x="50" y="1110" width="760" height="330" rx="14"/><text class="head" x="80" y="1150">Today’s schedule</text><rect class="accent" x="80" y="1180" width="300" height="210" rx="10"/><text class="label" x="105" y="1215">Patient queue</text><text class="txt" x="105" y="1250">09:00  Maya Patel</text><text class="txt" x="105" y="1285">10:30  Alex Morgan</text><text class="txt" x="105" y="1320">11:30  Jordan Lee</text><rect class="panel" x="410" y="1180" width="360" height="210" rx="10"/><text class="label" x="435" y="1215">Selected appointment</text><text class="txt" x="435" y="1250">Alex Morgan</text><text class="small" x="435" y="1278">Cardiology • 10:30 AM</text><rect class="success" x="435" y="1310" width="140" height="34" rx="5"/><text class="small" x="458" y="1332">Mark complete</text><rect class="frame" x="590" y="1310" width="115" height="34" rx="5"/><text class="small" x="610" y="1332">View record</text>
  <rect class="frame" x="850" y="1110" width="570" height="330" rx="14"/><text class="head" x="880" y="1150">Appointment details</text><rect class="success" x="880" y="1175" width="100" height="30" rx="15"/><text class="small" x="900" y="1195">Confirmed</text><text class="txt" x="880" y="1245">Dr. Sarah Chen with Alex Morgan</text><text class="small" x="880" y="1275">Today, 2:30 PM • Cardiology</text><line class="thin" x1="880" y1="1300" x2="1380" y2="1300"/><text class="label" x="880" y="1330">Actions</text><rect class="accent" x="880" y="1350" width="125" height="34" rx="5"/><text class="small" x="905" y="1372">Reschedule</text><rect class="danger" x="1020" y="1350" width="110" height="34" rx="5"/><text class="small" x="1045" y="1372">Cancel</text><text class="small" x="880" y="1410">Activity: booking confirmed  •  2 hours ago</text>

  <text class="small" x="50" y="1470">Import this SVG into Figma, then add prototype links, component variants, and annotations. Replace FIGMA_LINK_PENDING in README.md with the public Figma URL.</text>
</svg>
